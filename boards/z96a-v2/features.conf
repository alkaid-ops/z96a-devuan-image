# z96a-v2 功能开关（阶段 2 Feature Flags）
#
# 由 boards/z96a-v2/userscripts/uscripts 的 run_function2 读取。
# 默认值 = 当前已验证镜像的行为；关闭某项只影响对应的可选功能。
# 修改后请跑：make preflight board=z96a-v2

# 桌面与主题（LXQt / Openbox / Windows 主题 / 图标）
ENABLE_DESKTOP=${ENABLE_DESKTOP:-1}

# 预置第三方应用（Thorium / QQ / 微信 / GridCraft / WordCraft / DeckCraft / OxideTerm）
ENABLE_APPS=${ENABLE_APPS:-1}

# mpv（V4L2 硬解构建）与视频栈
ENABLE_MULTIMEDIA=${ENABLE_MULTIMEDIA:-1}

# Vulkan / PanVK conformance layer（OxideTerm 走 Vulkan 所需）
ENABLE_VULKAN=${ENABLE_VULKAN:-1}

# LocalSend Next（OpenGL/FemtoVG 构建）
ENABLE_LOCALSEND=${ENABLE_LOCALSEND:-1}

# 关闭时保留 `OXIDETERM_FORCE_GL=1` 的回退说明，但不安装 Vulkan 层
