# Z96A AC/battery policy. Times are seconds since the last user activity.
[Policy]
ACDimTimeout=300
ACLockTimeout=600
ACSuspendTimeout=1800
ACScreenOffTimeout=600
ACPoweroffTimeout=3600
BatteryDimTimeout=120
BatteryLockTimeout=300
BatterySuspendTimeout=900
BatteryScreenOffTimeout=300
BatteryPoweroffTimeout=1800
DimBrightnessPercent=20
BatteryWarningPercent=30
BatteryCriticalPercent=20
CriticalShutdownGraceSeconds=60
ProfileSwitchGraceSeconds=30
LockInputResetsIdle=true
UnknownUsesACProfile=true
AutoSuspendEnabled=false
AutoAction=none
