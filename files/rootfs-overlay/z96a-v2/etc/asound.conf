# Z96A: route new ALSA clients to the RK817 speaker/headphone codec.
# Card numbers are not stable because other simple cards (HDMI and the
# es7202 microphone) register at boot too, so address the codec by card ID.
pcm.!default {
    type plug
    slave.pcm "hw:CARD=rk817ext,DEV=0"
}
ctl.!default {
    type hw
    card "rk817ext"
}

# Named capture device for the ES7202 PDM array (6ch: mic ch0/1,
# AEC reference ch2/3, headset/loopback ch4/5).  Address by card ID.
pcm.z96a_mic {
    type plug
    slave.pcm "hw:CARD=es7202mic,DEV=0"
}
