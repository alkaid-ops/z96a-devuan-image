# Z96A: bq257xx_fuel_gauge is the voltage/OCV fallback for battery capacity.
# The RK817 PMIC coulomb counter (rk817-battery) is the accurate hardware
# gauge.  Once rk817-battery is verified on the device, uncomment the
# blacklist line to disable the voltage-based fallback and avoid two
# BATTERY power supplies.
# blacklist bq257xx_fuel_gauge
