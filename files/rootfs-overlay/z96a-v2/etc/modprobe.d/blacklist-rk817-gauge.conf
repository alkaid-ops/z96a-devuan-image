# rk817_charger is the RK817 single-cell fuel-gauge driver.  This board is
# RK809 + 2S battery with a 140/20 voltage divider, which the mainline driver
# does not calibrate.  Keep it disabled until the RK809 2S divider/calibration
# patch lands; bq257xx-fgu remains the OCV fallback.
blacklist rk817_charger
