[General]
AllowGrabBaseKeypad=true
AllowGrabBaseSpecial=false
AllowGrabLocks=false
AllowGrabMiscKeypad=true
AllowGrabMiscSpecial=true
MultipleActionsBehaviour=first
WindowSize=@Invalid()

[XF86MonBrightnessDown.40]
Comment=☀ ↓
Enabled=true
Exec=/usr/local/bin/z96a-hotkey, brightness-down

[XF86MonBrightnessUp.41]
Comment=☀ ↑
Enabled=true
Exec=/usr/local/bin/z96a-hotkey, brightness-up

[XF86AudioMicMute.42]
Comment=Mic mute
Enabled=true
Exec=/usr/local/bin/z96a-hotkey, mic-mute

[XF86AudioMute.43]
Comment=Mute/unmute sound volume
Enabled=true
Exec=/usr/local/bin/z96a-hotkey, volume-mute-lxqt

[Control%2BAlt%2BM.44]
Comment=Panel mute shortcut disabled
Enabled=false
path=/panel/volume/mute

[XF86AudioLowerVolume.45]
Comment=Decrease sound volume
Enabled=true
Exec=/usr/local/bin/z96a-hotkey, volume-down

[XF86AudioRaiseVolume.46]
Comment=Increase sound volume
Enabled=true
Exec=/usr/local/bin/z96a-hotkey, volume-up

[Control%2BAlt%2BShift%2BDown.47]
Comment=Panel volume down disabled
Enabled=false
path=/panel/volume/down

[Control%2BAlt%2BShift%2BUp.48]
Comment=Panel volume up disabled
Enabled=false
path=/panel/volume/up

[XF86WLAN.49]
Comment=Wi-Fi toggle
Enabled=true
Exec=/usr/local/bin/z96a-hotkey, wifi-toggle

[XF86Battery.50]
Comment=Battery status
Enabled=true
Exec=/usr/local/bin/z96a-hotkey, battery

[Meta%2BLeft.51]
Comment=Snap window to the left half
Enabled=true
Exec=/usr/local/bin/z96a-window-tile, left

[Meta%2BRight.52]
Comment=Snap window to the right half
Enabled=true
Exec=/usr/local/bin/z96a-window-tile, right

[Meta%2BUp.53]
Comment=Snap window to the top half (again on a top tile maximizes)
Enabled=true
Exec=/usr/local/bin/z96a-window-tile, up

[Meta%2BDown.54]
Comment=Snap window to the bottom half (again on a bottom tile minimizes)
Enabled=true
Exec=/usr/local/bin/z96a-window-tile, down

[Meta%2BPrior.55]
Comment=Maximize/restore the active window
Enabled=true
Exec=/usr/local/bin/z96a-window-tile, maximize

[Meta%2BNext.56]
Comment=Minimize the active window
Enabled=true
Exec=/usr/local/bin/z96a-window-tile, minimize

[Meta%2BBackSpace.57]
Comment=Restore the active window to its pre-snap geometry
Enabled=true
Exec=/usr/local/bin/z96a-window-tile, restore
