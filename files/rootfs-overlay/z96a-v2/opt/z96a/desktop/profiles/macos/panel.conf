panels=panel1

[panel1]
plugins=mainmenu,taskbar,statusnotifier,tray,mount,sysmon,worldclock,showdesktop
position=Top
desktop=0
panelSize=36
iconSize=28
width=100
width-percent=true
alignment=-1
background-color=#eceff2
reserve-space=true

[mainmenu]
type=mainmenu
filterClear=true

[taskbar]
type=taskbar
buttonWidth=190
closeOnMiddleClick=true
groupingEnabled=true

[mount]
type=mount

[worldclock]
type=worldclock
useAdvancedManualFormat=true
customFormat=M月d日 ddd HH:mm:ss
alignment=Right

[showdesktop]
alignment=Right
type=showdesktop

[statusnotifier]
alignment=Right
type=statusnotifier

[tray]
type=tray

[sysmon]
alignment=Right
type=z96a-sysmon
