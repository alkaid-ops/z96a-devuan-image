panels=panel1

[panel1]
plugins=mainmenu,taskbar,statusnotifier,tray,mount,sysmon,worldclock,showdesktop
position=Bottom
desktop=0
panelSize=50
iconSize=30
width=100
width-percent=true
alignment=-1
background-color=#1e4a7a
background-image=/usr/share/z96a/panel/windows7.png
font-color=#ffffff
reserve-space=true

[mainmenu]
type=mainmenu
filterClear=true

[taskbar]
type=taskbar
buttonWidth=170
closeOnMiddleClick=true
groupingEnabled=false

[mount]
type=mount

[worldclock]
type=worldclock
useAdvancedManualFormat=true
customFormat=M月d日 ddd HH:mm:ss
alignment=Right

[showdesktop]
alignment=Right
type=showdesktop

[statusnotifier]
alignment=Right
type=statusnotifier

[tray]
type=tray

[sysmon]
alignment=Right
type=z96a-sysmon
