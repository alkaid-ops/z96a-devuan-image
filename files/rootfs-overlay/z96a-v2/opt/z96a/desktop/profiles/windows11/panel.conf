panels=panel1,panel2,panel3

[panel1]
plugins=mainmenu
position=Bottom
desktop=0
panelSize=42
iconSize=32
width=18
width-percent=true
alignment=-1
background-color=#e7edf5
reserve-space=true

[mainmenu]
type=mainmenu
filterClear=true

[taskbar]
type=taskbar
buttonWidth=200
closeOnMiddleClick=true
groupingEnabled=true

[mount]
type=mount

[worldclock]
type=worldclock
useAdvancedManualFormat=true
customFormat=M月d日 ddd HH:mm:ss
alignment=Right

[showdesktop]
alignment=Right
type=showdesktop

[statusnotifier]
alignment=Right
type=statusnotifier

[tray]
type=tray

[panel2]
plugins=taskbar
position=Bottom
desktop=0
panelSize=42
iconSize=32
width=58
width-percent=true
alignment=0
reserve-space=true

[panel3]
plugins=statusnotifier,tray,mount,sysmon,worldclock,showdesktop
position=Bottom
desktop=0
panelSize=42
iconSize=30
width=22
width-percent=true
alignment=1
reserve-space=true

[sysmon]
alignment=Right
type=z96a-sysmon
