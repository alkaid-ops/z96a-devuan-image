name: publish-image

# Stage 5: publish the exact artifact from one successful image-temp run.
# No image assembly occurs in this workflow.
on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Successful image-temp workflow run ID"
        required: true
        type: string
      release_tag:
        description: "Final version tag (e.g. v2.0.0)"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: z96a-publish-image-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    steps:
      - name: Verify source run and artifact identity
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.artifact_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "invalid run ID" >&2; exit 2; }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){1,2}$ ]] || { echo "invalid final tag" >&2; exit 2; }
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")
          workflow_path=$(jq -r '.path' <<<"$run" | cut -d@ -f1)
          conclusion=$(jq -r '.conclusion' <<<"$run")
          event=$(jq -r '.event' <<<"$run")
          attempt=$(jq -r '.run_attempt' <<<"$run")
          head_sha=$(jq -r '.head_sha' <<<"$run")
          head_branch=$(jq -r '.head_branch' <<<"$run")
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" -q .default_branch)
          if [ "$workflow_path" != ".github/workflows/image-temp.yml" ] ||
             [ "$conclusion" != success ] || [ "$event" != workflow_dispatch ] ||
             [ "$head_branch" != "$default_branch" ]; then
            echo "run is not a successful manual image-temp run" >&2
            exit 1
          fi
          name="z96a-image-${SOURCE_RUN_ID}-${attempt}"
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts")
          artifact=$(jq -c --arg name "$name" '[.artifacts[] | select(.name == $name and .expired == false)] | first // empty' <<<"$artifacts")
          [ -n "$artifact" ] || { echo "expected artifact missing or expired: $name" >&2; exit 1; }
          echo "artifact_name=$name" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$attempt" >> "$GITHUB_OUTPUT"
          echo "source_run=$SOURCE_RUN_ID, attempt=$attempt, commit=$head_sha, artifact=$name"

      - name: Check out the exact stage-4 source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.head_sha }}
          fetch-depth: 0

      - name: Reclaim runner disk space and check capacity
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android/sdk /opt/ghc /usr/share/dotnet \
            /usr/local/share/powershell /usr/local/share/chromium
          sudo docker system prune -af || true
          avail_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          if [ "$avail_kb" -lt 14680064 ]; then
            echo "less than 14 GiB free for artifact + decompressed image (${avail_kb}KiB)" >&2
            exit 1
          fi
          df -h /

      - name: Download the exact stage-4 artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: dist

      - name: Verify artifact contents and checksums
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ steps.source.outputs.head_sha }}
        run: |
          set -euo pipefail
          mapfile -t images < <(find dist -maxdepth 1 -type f -name '*.img.xz' -print)
          [ "${#images[@]}" -eq 1 ] || { echo "expected exactly one image artifact" >&2; exit 1; }
          image=${images[0]}
          packaging/check-release-asset.sh "$image"
          (cd dist && sha256sum -c "$(basename "$image").sha256")
          for f in manifest.json sbom.json build-evidence.json components.json build.log; do
            test -s "dist/$f" || { echo "missing artifact file: $f" >&2; exit 1; }
          done
          evidence_tag=$(jq -r '.release_tag' dist/build-evidence.json)
          [ "$evidence_tag" = "$RELEASE_TAG" ] || {
            echo "artifact intended for $evidence_tag, not $RELEASE_TAG" >&2; exit 1;
          }
          evidence_commit=$(jq -r '.commit' dist/build-evidence.json)
          [ "$evidence_commit" = "$SOURCE_SHA" ] || {
            echo "artifact commit does not match source run" >&2; exit 1;
          }
          jq -e '.validation == "PASS"' dist/build-evidence.json >/dev/null || {
            echo "stage-4 artifact was not fully validated" >&2; exit 1;
          }
          printf 'image=%s\nsha256=%s\n' "$(basename "$image")" "$(sha256sum "$image" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        id: verify

      - name: Ensure build container for structural validation
        run: |
          set -euo pipefail
          image=${Z96A_BUILD_IMAGE:-z96a-build:local}
          if ! docker image inspect "$image" >/dev/null 2>&1; then
            docker build -f boards/z96a-v2/tools/Dockerfile -t "$image" .
          fi

      - name: Revalidate image structure
        run: boards/z96a-v2/tools/ci-validate-image.sh "dist/${{ steps.verify.outputs.image }}"

      - name: Upload verified files to the target draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "git tag already exists; refusing to publish or move it: $RELEASE_TAG" >&2
            exit 1
          fi
          cat > "$notes" <<EOF
          Z96A ${RELEASE_TAG} — Devuan 6 Excalibur / LXQt 2.1 / X11.

          Built and structurally validated by GitHub Actions. This release uses the exact image artifact from workflow run ${{ inputs.artifact_run_id }} (attempt ${{ steps.source.outputs.run_attempt }}); it was not rebuilt during publication.

          Component selection and checksums are recorded in components.json. Build provenance and image SHA256 are recorded in build-evidence.json.
          EOF
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)
            [ "$draft" = true ] || { echo "refusing to overwrite a published release" >&2; exit 1; }
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" --notes-file "$notes" --draft
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --title "$RELEASE_TAG" --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/*.img.xz dist/*.img.xz.sha256 dist/manifest.json dist/sbom.json \
            dist/build-evidence.json dist/components.json dist/build.log
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease=false --latest
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets -q \
            '"tag=\(.tagName) draft=\(.isDraft) prerelease=\(.isPrerelease)", (.assets[] | "asset=\(.name) \(.size)")'

      - name: Summarize publication
        run: |
          {
            echo "### Published ${{ inputs.release_tag }}"
            echo "- source run: ${{ inputs.artifact_run_id }} (attempt ${{ steps.source.outputs.run_attempt }})"
            echo "- image: ${{ steps.verify.outputs.image }}"
            echo "- SHA256: ${{ steps.verify.outputs.sha256 }}"
            echo "- built from commit: ${{ steps.source.outputs.head_sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
