name: release

# Tag a commit with vX.Y.Z (or vX.Y) to build, validate and publish an image.
# The tag must already point at a commit on the default branch's release line;
# moving or deleting a published tag is not supported.
# Keep the workflow file on the default branch so tag events are discoverable.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: z96a-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Verify release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require vX.Y[.Z] tag format on the default branch
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+(\.[0-9]+){1,2}([.-][0-9A-Za-z.-]+)?$'; then
            echo "invalid release tag: $tag" >&2
            echo "expected vX.Y or vX.Y.Z" >&2
            exit 1
          fi
          default="${{ github.event.repository.default_branch }}"
          git fetch --no-tags origin "$default"
          if ! git merge-base --is-ancestor HEAD "origin/$default"; then
            echo "tag $tag is not on $default; release from a merged commit only" >&2
            exit 1
          fi
          echo "release tag: $tag (ancestor of $default)"

  build:
    name: Build and validate image
    needs: tag
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    with:
      channel: ${{ contains(github.ref_name, '-') && 'test' || 'stable' }}
      release_tag: ${{ github.ref_name }}
      validate: true

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Verify checksum before publishing
        run: |
          set -eu
          cd dist
          ls -l
          sha256sum -c ./*.img.xz.sha256

      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.img.xz
            dist/*.img.xz.sha256
            dist/manifest.json
            dist/sbom.json
            dist/build-evidence.json
