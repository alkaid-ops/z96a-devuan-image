name: build

# Manual image build. Produces an Actions artifact only; it never publishes a
# GitHub release. Use a version tag to publish (see release.yml).
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "RELEASE_CHANNEL recorded in manifest.json"
        type: choice
        options: [nightly, stable, test]
        default: nightly
      validate:
        description: "Run loop-mount image validation"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: z96a-manual-build
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    with:
      channel: ${{ inputs.channel }}
      release_tag: ""
      validate: ${{ inputs.validate }}
