name: kernel

# Build the z96a-v2 kernel as an independent component release.
#
# The image assembly never compiles a kernel: it consumes a component pinned
# by config/inputs.lock. Updating the lock is a manual commit (strategy A):
# after this workflow publishes kernel-<ver>-rN, run
#   config/inputs.lock: kernel_release / kernel_sums
# and then dispatch the image build.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (empty = kernel-<ver>-r<run number>)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: z96a-kernel
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  kernel:
    # x86 runner + aarch64 cross compiler: the kernel is not QEMU-emulated.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      release_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false

      - name: Ensure build container
        run: |
          set -eu
          image=${Z96A_BUILD_IMAGE:-z96a-build:local}
          if ! docker image inspect "$image" >/dev/null 2>&1; then
            docker build -f boards/z96a-v2/tools/Dockerfile -t "$image" .
          fi

      - name: Clean root-owned build output
        run: |
          set -eu
          docker run --rm -v "$PWD:/build" -w /build z96a-build:local \
            bash -lc 'rm -rf output board.txt board.runtime kernel.release p1 p2 sysroot img shrink.img'

      - name: Build kernel
        env:
          TERM: xterm
        run: |
          set -o pipefail
          boards/z96a-v2/tools/build-in-container.sh kernel 2>&1 | tee kernel-build.log || {
            echo "---- patch log ----"
            cat output/z96a-v2/logs/*linux-patch*.log 2>/dev/null | tail -80
            exit 1
          }

      - name: Verify kernel deb matches the compiled tree
        run: |
          set -eu
          ls -l output/z96a-v2/linux-image-z96a_*.deb output/z96a-v2/linux-headers-z96a_*.deb
          tmp=$(mktemp -d)
          dpkg-deb -x output/z96a-v2/linux-image-z96a_*.deb "$tmp"
          ko=$(find "$tmp" -name rockchip-vdec.ko -print -quit)
          test -n "$ko"
          modinfo "$ko" | grep -q 'rockchip,rk3568-vdec'
          sha256sum "$tmp/boot/Image"
          rm -rf "$tmp"

      - name: Stage component release
        id: tag
        run: |
          set -eu
          version=$(sed -n 's/^FORCE_LINUX_VERSION="\([^"]*\)".*/\1/p' lib/boards/z96a-v2 | head -1)
          tag="${INPUT_TAG:-kernel-${version}-r${GITHUB_RUN_NUMBER}}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          stage=$(mktemp -d)
          mkdir -p "$stage/debs"
          cp output/z96a-v2/linux-image-z96a_*.deb \
             output/z96a-v2/linux-headers-z96a_*.deb "$stage/debs/"
          (cd "$stage" && sha256sum debs/*.deb > SHA256SUMS.kernel)

          image_sha=$(tmpdir=$(mktemp -d); dpkg-deb -x "$stage"/debs/linux-image-*.deb "$tmpdir"; sha256sum "$tmpdir/boot/Image" | cut -d' ' -f1; rm -rf "$tmpdir")
          series_sha=$(cat patches/git/z96a-v2/linux-add_sunniwell_z96a/*.patch | sha256sum | cut -d' ' -f1)
          cat > "$stage/kernel-meta.json" <<EOF
          {
            "version": "${version}-1",
            "image_sha256": "$image_sha",
            "patch_series_sha256": "$series_sha",
            "commit": "${GITHUB_SHA}",
            "builder": "kernel.yml run ${GITHUB_RUN_ID}"
          }
          EOF

          gh release create "$tag" "$stage"/debs/*.deb \
            "$stage/SHA256SUMS.kernel" "$stage/kernel-meta.json" \
            --repo "$GITHUB_REPOSITORY" --prerelease --title "$tag" \
            --notes "Kernel component from ${GITHUB_SHA}; pin it in config/inputs.lock, then dispatch the image build."
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - name: Summarize
        run: |
          echo "### Kernel component: ${{ steps.tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Next: set kernel_release/kernel_sums in config/inputs.lock (sums = sha256 of the SHA256SUMS.kernel asset)." >> "$GITHUB_STEP_SUMMARY"
