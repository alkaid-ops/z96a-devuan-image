name: publish-existing

# Publish an image that was already built and validated elsewhere (for example
# a local build that has been flashed and exercised on the device) without
# rebuilding it.
#
# Assets are uploaded once to the *draft* release for the final tag. A draft
# release does not create the git tag, so nothing triggers release.yml and no
# image is rebuilt. This workflow downloads the draft assets, re-verifies the
# compressed asset (and optionally the mounted image structure), then publishes
# the draft as the version release.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag whose draft holds the built assets (vX.Y or vX.Y.Z)"
        required: true
        type: string
      validate:
        description: "Loop-mount the decompressed image and check its structure"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: z96a-publish-existing
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  publish:
    name: Verify and publish staged image
    # The structure check runs validate-image.sh in the arm64 build container
    # and chroots into the image root, so it needs a native arm64 runner.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out the publishing commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Guard draft release and tag format
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -eu
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+(\.[0-9]+){1,2}$'; then
            echo "invalid release tag: $RELEASE_TAG (expected vX.Y or vX.Y.Z)" >&2
            exit 1
          fi
          draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft -q .isDraft 2>/dev/null || echo missing)
          if [ "$draft" != "true" ]; then
            echo "expected an unpublished draft release for $RELEASE_TAG (got: $draft)" >&2
            exit 1
          fi
          echo "publishing draft release $RELEASE_TAG"

      - name: Reclaim runner disk space
        run: |
          set -eu
          sudo rm -rf /usr/local/lib/android/sdk /opt/ghc /usr/share/dotnet \
            /usr/local/share/powershell /usr/local/share/chromium
          sudo docker system prune -af || true
          avail_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          # compressed asset + decompressed image + build container layers.
          if [ "$avail_kb" -lt 14680064 ]; then
            echo "less than 14 GiB free on runner root filesystem (${avail_kb}KiB)" >&2
            exit 1
          fi
          df -h /

      - name: Download draft release assets
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -eu
          mkdir -p dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir dist --pattern '*.img.xz' --pattern '*.img.xz.sha256' \
            --pattern 'manifest.json' --pattern 'sbom.json' \
            --pattern 'build-evidence.json'
          ls -lh dist

      - name: Verify compressed assets before publishing
        run: |
          set -eu
          img=$(ls -t dist/*.img.xz | head -n 1)
          packaging/check-release-asset.sh "$img"
          (cd dist && sha256sum -c "$(basename "$img").sha256")
          for name in manifest.json sbom.json build-evidence.json; do
            test -s "dist/$name" || { echo "missing staged asset: $name" >&2; exit 1; }
          done

      - name: Ensure build container
        if: inputs.validate
        run: |
          set -eu
          image=${Z96A_BUILD_IMAGE:-z96a-build:local}
          if ! docker image inspect "$image" >/dev/null 2>&1; then
            docker build -f boards/z96a-v2/tools/Dockerfile -t "$image" .
          fi

      - name: Validate image structure
        if: inputs.validate
        run: |
          set -eu
          img=$(ls -t dist/*.img.xz | head -n 1)
          boards/z96a-v2/tools/ci-validate-image.sh "$img"

      - name: Remove decompressed image
        if: always()
        run: rm -f output/ci/*.img || true

      - name: Publish draft as the version release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -eu
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease=false --latest
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets -q \
            '"tag=\(.tagName) draft=\(.isDraft) prerelease=\(.isPrerelease)", (.assets[] | "asset=\(.name) \(.size)")'

      - name: Summarize
        run: |
          set -eu
          img=$(ls -t dist/*.img.xz | head -n 1)
          {
            echo "### Published ${{ inputs.release_tag }}"
            echo ""
            echo "- image: $(basename "$img")"
            echo "- bytes: $(stat -c '%s' "$img")"
            echo "- sha256: $(sha256sum "$img" | cut -d' ' -f1)"
            echo "- release notes are taken from the draft body"
          } >> "$GITHUB_STEP_SUMMARY"
